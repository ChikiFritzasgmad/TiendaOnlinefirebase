    <script>
        // ============================================
        // CONFIGURACIÓN Y VARIABLES GLOBALES - VERSIÓN OPTIMIZADA
        // ============================================
        const WHATSAPP_NUM = "56936416743"; 
        
        // Estado global optimizado
        let cart = JSON.parse(localStorage.getItem('papajose_cart')) || [];
        let displayedProducts = []; // Solo productos mostrados
        let allProductsCache = []; // Cache completo para búsqueda local
        const INITIAL_BATCH_SIZE = 16; // Múltiplo de 4 para mejor grid
        const BATCH_SIZE = 20; // Tamaño de cada lote adicional
        
        // Variables de control de paginación
        let lastVisibleDoc = null;
        let isLoading = false;
        let hasMoreProducts = true;
        let currentCategory = 'todas';
        let currentSearch = '';
        
        // Cache de imágenes
        const imageCache = new Map();
        const PLACEHOLDER_SVG = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'%3E%3Crect width='400' height='400' fill='%23f0f0f0'/%3E%3Ctext x='50%25' y='50%25' font-family='Arial' font-size='14' text-anchor='middle' dy='.3em' fill='%23999'%3ESin Foto%3C/text%3E%3C/svg%3E";

        // ============================================
        // INICIALIZACIÓN RÁPIDA
        // ============================================

        window.addEventListener('DOMContentLoaded', () => {
            // Iniciar UI inmediatamente
            updateCartUI();
            initSwipeGestures();
            
            // Mostrar contenido estático rápido
            setTimeout(() => {
                document.getElementById('loading-msg').querySelector('p').textContent = 'Cargando vista previa...';
            }, 500);
            
            // Iniciar carga en paralelo
            iniciarCargaRapida();
        });

        async function iniciarCargaRapida() {
            try {
                // 1. CARGAR PRIMER BATCH RÁPIDO
                mostrarSkeletonLoading(true);
                
                // Si Firebase no está listo, esperar un poco
                let attempts = 0;
                while (!window.firebaseReady && attempts < 10) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }
                
                if (!window.firebaseReady) {
                    throw new Error("Firebase no se inicializó");
                }
                
                // Cargar primer lote
                await cargarProductosBatch(true);
                
                // 2. CARGAR EL RESTO EN SEGUNDO PLANO
                setTimeout(() => cargarRestoProductos(), 1000);
                
                // 3. CARGAR CATEGORÍAS EN PARALELO
                cargarCategorias();
                
            } catch (error) {
                console.error("Error en carga rápida:", error);
                mostrarToast("Error de conexión. Recargando...", "error");
                setTimeout(() => location.reload(), 2000);
            }
        }

        async function cargarRestoProductos() {
            try {
                // Continuar cargando en segundo plano
                while (hasMoreProducts) {
                    await cargarProductosBatch(false);
                    if (displayedProducts.length >= 50) break; // Límite para no sobrecargar
                }
                
                // Una vez cargado todo, actualizar cache
                allProductsCache = [...displayedProducts];
                
            } catch (error) {
                console.warn("Error cargando productos en segundo plano:", error);
            }
        }

        // ============================================
        // CARGA POR LOTES OPTIMIZADA
        // ============================================

        async function cargarProductosBatch(isFirstBatch = false) {
            if (isLoading || (!hasMoreProducts && !isFirstBatch)) return;
            
            isLoading = true;
            const wasFirstBatch = isFirstBatch;
            
            try {
                // Ocultar loading message después del primer batch
                if (wasFirstBatch) {
                    setTimeout(() => {
                        document.getElementById('loading-msg').classList.add('hidden');
                        document.getElementById('seccion-catalogo').classList.remove('hidden');
                    }, 300);
                }
                
                // Construir query
                const productosRef = window.firebaseFunctions.collection(window.firebaseDb, 'productos');
                let constraints = [];
                
                // Aplicar filtros
                if (currentCategory && currentCategory !== 'todas') {
                    constraints.push(window.firebaseFunctions.where('categoria', '==', currentCategory));
                }
                
                // Ordenar por nombre (requerido para paginación)
                constraints.push(window.firebaseFunctions.orderBy('nombre'));
                
                // Paginación
                if (!wasFirstBatch && lastVisibleDoc) {
                    constraints.push(window.firebaseFunctions.startAfter(lastVisibleDoc));
                }
                
                // Límite
                constraints.push(window.firebaseFunctions.limit(wasFirstBatch ? INITIAL_BATCH_SIZE : BATCH_SIZE));
                
                // Ejecutar query
                const q = window.firebaseFunctions.query(productosRef, ...constraints);
                const snapshot = await window.firebaseFunctions.getDocs(q);
                
                // Actualizar cursor
                if (snapshot.docs.length > 0) {
                    lastVisibleDoc = snapshot.docs[snapshot.docs.length - 1];
                }
                
                // Verificar si hay más productos
                hasMoreProducts = snapshot.docs.length === (wasFirstBatch ? INITIAL_BATCH_SIZE : BATCH_SIZE);
                
                // Procesar productos
                const nuevosProductos = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const producto = formatearProducto(doc.id, data);
                    nuevosProductos.push(producto);
                });
                
                // Actualizar estado
                if (wasFirstBatch) {
                    displayedProducts = nuevosProductos;
                    renderizarProductos(nuevosProductos, true);
                    
                    // Renderizar destacados con los primeros disponibles
                    const destacados = nuevosProductos
                        .filter(p => p.disponible)
                        .slice(0, 6);
                    renderDestacados(destacados);
                    
                } else {
                    displayedProducts = [...displayedProducts, ...nuevosProductos];
                    renderizarProductos(nuevosProductos, false);
                }
                
                // Actualizar contador
                actualizarContador();
                
            } catch (error) {
                console.error("Error cargando batch:", error);
                if (wasFirstBatch) {
                    mostrarToast("Error cargando productos", "error");
                }
            } finally {
                isLoading = false;
                mostrarSkeletonLoading(false);
                actualizarBotonCargarMas();
            }
        }

        function formatearProducto(id, data) {
            // Función optimizada para formatear
            return {
                id: id,
                nombre: (data.nombre || "Sin Nombre").toString().replace(/[<>"']/g, ''),
                precio: typeof data.precio === 'number' ? data.precio : 
                       parseInt((data.precio || '0').toString().replace(/[^0-9]/g, '')) || 0,
                cat: (data.categoria || "Varios").toString().replace(/[<>"']/g, ''),
                desc: (data.descripcion || "").toString().replace(/[<>"']/g, ''),
                img: data.foto && data.foto.trim() ? data.foto.trim() : PLACEHOLDER_SVG,
                disponible: (data.stock || '').toString().toLowerCase().trim() === 'si'
            };
        }

        // ============================================
        // RENDERIZADO OPTIMIZADO
        // ============================================

        function renderizarProductos(productos, reset = false) {
            const container = document.getElementById('grid-productos');
            
            if (reset) {
                container.innerHTML = '';
            }
            
            // Usar DocumentFragment para mejor performance
            const fragment = document.createDocumentFragment();
            
            productos.forEach(producto => {
                const card = document.createElement('div');
                card.className = 'fade-in-up';
                card.style.animationDelay = `${Math.random() * 0.2}s`;
                card.innerHTML = cardHTML(producto);
                fragment.appendChild(card);
            });
            
            container.appendChild(fragment);
            
            // Iniciar lazy loading después de añadir al DOM
            setTimeout(() => initLazyLoad(), 100);
        }

        function cardHTML(p) {
            const disponible = p.disponible;
            const btnClass = disponible ? 
                "bg-gray-900 text-white hover:bg-beige" : 
                "bg-gray-200 text-gray-400 cursor-not-allowed";
            const btnText = disponible ? "Agregar" : "Agotado";
            const action = disponible ? `addToCart('${p.id}')` : "";
            const imageClass = disponible ? "" : "no-stock";
            
            // Pre-cache de imagen
            if (!imageCache.has(p.img)) {
                const img = new Image();
                img.src = p.img;
                imageCache.set(p.img, img);
            }
            
            return `
                <div class="bg-white rounded-2xl border border-gray-100 hover:border-beige/50 transition-all duration-300 group hover:shadow-lg relative flex flex-col h-full overflow-hidden shadow-sm">
                    <div class="relative h-48 md:h-56 bg-white p-2 cursor-pointer" onclick="openProduct('${p.id}')">
                        <img data-src="${p.img}" 
                             class="lazy-load w-full h-full object-contain group-hover:scale-105 transition duration-500 ${imageClass}" 
                             alt="${p.nombre}"
                             loading="lazy"
                             decoding="async"
                             onerror="this.onerror=null; this.src='${PLACEHOLDER_SVG}'; this.classList.add('img-placeholder')">
                        <span class="absolute bottom-0 left-0 bg-gray-100 px-2 py-1 text-[10px] font-bold text-gray-600 uppercase tracking-wider rounded-tr-lg">${p.cat.substring(0,15)}</span>
                        ${!disponible ? '<span class="absolute top-2 right-2 bg-red-500 text-white px-2 py-1 text-[10px] font-bold rounded">AGOTADO</span>' : ''}
                    </div>
                    <div class="p-4 flex flex-col grow">
                        <h4 class="font-medium text-gray-800 text-sm mb-3 leading-snug line-clamp-2 grow">${p.nombre}</h4>
                        <div class="flex items-center justify-between mt-auto pt-2 border-t border-gray-50">
                            <span class="font-black text-lg text-gray-900">$${p.precio.toLocaleString()}</span>
                            <button onclick="${action}" class="text-xs font-bold px-3 py-2 rounded-lg transition uppercase ${btnClass}">${btnText}</button>
                        </div>
                    </div>
                </div>`;
        }

        // ============================================
        // BÚSQUEDA LOCAL (MÁS RÁPIDA)
        // ============================================

        let searchDebounce;
        let lastSearchTerm = '';

        function buscar(term) {
            const cleanTerm = term.trim().toLowerCase();
            
            // Evitar búsquedas duplicadas
            if (cleanTerm === lastSearchTerm) return;
            lastSearchTerm = cleanTerm;
            
            clearTimeout(searchDebounce);
            
            // Búsqueda instantánea si está vacío
            if (!cleanTerm) {
                resetearBusqueda();
                return;
            }
            
            searchDebounce = setTimeout(async () => {
                // Mostrar skeleton
                mostrarSkeletonLoading(true);
                document.getElementById('grid-productos').innerHTML = '';
                
                // Si tenemos cache completo, buscar localmente
                if (allProductsCache.length > 0) {
                    const resultados = allProductsCache.filter(p => 
                        p.nombre.toLowerCase().includes(cleanTerm) ||
                        p.cat.toLowerCase().includes(cleanTerm) ||
                        p.desc.toLowerCase().includes(cleanTerm)
                    );
                    
                    displayedProducts = resultados;
                    renderizarProductos(resultados.slice(0, 40), true);
                    actualizarContador();
                    mostrarSkeletonLoading(false);
                    document.getElementById('load-more-container').classList.add('hidden');
                    
                    if (resultados.length === 0) {
                        mostrarToast("No se encontraron productos", "info");
                    }
                } else {
                    // Si no hay cache, buscar en Firebase
                    await buscarEnFirebase(cleanTerm);
                }
            }, 300);
        }

        async function buscarEnFirebase(term) {
            try {
                const productosRef = window.firebaseFunctions.collection(window.firebaseDb, 'productos');
                
                // Nota: Firestore no soporta búsqueda con contains de forma nativa
                // Esta es una aproximación limitada
                const q = window.firebaseFunctions.query(
                    productosRef,
                    window.firebaseFunctions.orderBy('nombre'),
                    window.firebaseFunctions.limit(50)
                );
                
                const snapshot = await window.firebaseFunctions.getDocs(q);
                const resultados = [];
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const producto = formatearProducto(doc.id, data);
                    const searchable = (producto.nombre + ' ' + producto.cat + ' ' + producto.desc).toLowerCase();
                    
                    if (searchable.includes(term)) {
                        resultados.push(producto);
                    }
                });
                
                displayedProducts = resultados;
                renderizarProductos(resultados, true);
                actualizarContador();
                document.getElementById('load-more-container').classList.add('hidden');
                
                if (resultados.length === 0) {
                    mostrarToast("No se encontraron productos", "info");
                }
                
            } catch (error) {
                console.error("Error en búsqueda:", error);
                mostrarToast("Error al buscar", "error");
            } finally {
                mostrarSkeletonLoading(false);
            }
        }

        function resetearBusqueda() {
            currentSearch = '';
            lastSearchTerm = '';
            currentCategory = 'todas';
            lastVisibleDoc = null;
            hasMoreProducts = true;
            
            document.getElementById('titulo-grid').textContent = 'Catálogo';
            cargarProductosBatch(true);
        }

        // ============================================
        // FILTRADO POR CATEGORÍA
        // ============================================

        function filtrar(categoria, btnElement) {
            // Actualizar estado
            currentCategory = categoria;
            currentSearch = '';
            lastVisibleDoc = null;
            hasMoreProducts = true;
            
            // Actualizar UI
            document.querySelectorAll('#nav-categorias button').forEach(btn => {
                btn.className = "w-full text-left px-5 py-3 rounded-xl hover:bg-gray-50 font-medium text-gray-600 flex items-center gap-3 transition-all group";
            });
            
            if (btnElement) {
                btnElement.className = "w-full text-left px-5 py-3 rounded-xl bg-gray-50 font-bold text-beige flex items-center gap-3 transition-all group border-l-4 border-beige";
            }
            
            // Actualizar título
            document.getElementById('titulo-grid').textContent = categoria === 'todas' ? 'Catálogo' : categoria;
            
            // Cargar productos
            cargarProductosBatch(true);
            
            // Cerrar menú móvil si está abierto
            if (window.innerWidth < 1024) {
                toggleMobileMenu();
            }
        }

        async function cargarCategorias() {
            try {
                // Intento 1: Leer categorías desde cache local
                const categoriasUnicas = [...new Set(allProductsCache.map(p => p.cat))].filter(c => c).sort();
                
                if (categoriasUnicas.length > 0) {
                    generarMenuCategorias(categoriasUnicas);
                    return;
                }
                
                // Intento 2: Leer algunas categorías desde Firebase
                const productosRef = window.firebaseFunctions.collection(window.firebaseDb, 'productos');
                const q = window.firebaseFunctions.query(productosRef, window.firebaseFunctions.limit(100));
                const snapshot = await window.firebaseFunctions.getDocs(q);
                
                const categorias = new Set();
                snapshot.forEach(doc => {
                    const categoria = doc.data().categoria;
                    if (categoria) categorias.add(categoria);
                });
                
                generarMenuCategorias(Array.from(categorias).sort());
                
            } catch (error) {
                console.warn("Error cargando categorías:", error);
                // Usar categorías por defecto
                generarMenuCategorias(['Alimentos de juguete', 'Juguetes', 'Hogar', 'Accesorios']);
            }
        }

        function generarMenuCategorias(categorias) {
            const nav = document.getElementById('nav-categorias');
            if (!nav) return;
            
            // Limpiar y agregar "Todo"
            nav.innerHTML = `
                <button id="btn-todas" class="w-full text-left px-5 py-3 rounded-xl bg-gray-50 font-bold text-beige flex items-center gap-3 transition-all group border-l-4 border-beige"
                        onclick="filtrar('todas', this)">
                    <i class="fa fa-border-all text-beige group-hover:scale-110 transition w-5 text-center"></i> Todo
                </button>
            `;
            
            // Agregar cada categoría
            categorias.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left px-5 py-3 rounded-xl hover:bg-gray-50 font-medium text-gray-600 flex items-center gap-3 transition-all group";
                btn.onclick = () => filtrar(cat, btn);
                btn.innerHTML = `<i class="fa fa-chevron-right text-gray-300 text-xs group-hover:text-beige transition"></i> ${cat}`;
                nav.appendChild(btn);
            });
        }

        // ============================================
        // FUNCIONES AUXILIARES
        // ============================================

        function mostrarSkeletonLoading(mostrar) {
            const skeleton = document.getElementById('skeleton-loading');
            if (mostrar) {
                skeleton.classList.remove('hidden');
            } else {
                skeleton.classList.add('hidden');
            }
        }

        function actualizarContador() {
            const countElement = document.getElementById('cantidad-productos');
            if (countElement) {
                countElement.textContent = displayedProducts.length + (hasMoreProducts ? '+' : '');
            }
        }

        function actualizarBotonCargarMas() {
            const container = document.getElementById('load-more-container');
            const button = document.getElementById('load-more-btn');
            const spinner = document.getElementById('load-more-spinner');
            
            if (!container || !button) return;
            
            if (hasMoreProducts && currentSearch === '') {
                container.classList.remove('hidden');
                button.disabled = false;
                spinner.classList.add('hidden');
                button.innerHTML = 'Cargar más productos';
            } else {
                container.classList.add('hidden');
            }
        }

        function cargarMasProductos() {
            if (!isLoading && hasMoreProducts) {
                const button = document.getElementById('load-more-btn');
                const spinner = document.getElementById('load-more-spinner');
                
                button.disabled = true;
                spinner.classList.remove('hidden');
                button.innerHTML = 'Cargando...';
                
                cargarProductosBatch(false);
            }
        }

        function resetAndScrollToTop() {
            // Resetear todo
            currentCategory = 'todas';
            currentSearch = '';
            lastSearchTerm = '';
            document.querySelectorAll('input[type="text"]').forEach(input => input.value = '');
            
            // Aplicar filtro "todo"
            const btnTodo = document.getElementById('btn-todas');
            if (btnTodo) filtrar('todas', btnTodo);
            
            // Scroll al inicio
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            mostrarToast("Catálogo restablecido", "info");
        }

        // ============================================
        // FUNCIONALIDADES DEL CARRITO (MANTENIDAS)
        // ============================================

        function addToCart(id) {
            const producto = displayedProducts.find(p => p.id === id) || 
                            allProductsCache.find(p => p.id === id);
            
            if (!producto) {
                mostrarToast("Producto no encontrado", "error");
                return;
            }
            
            if (!producto.disponible) {
                mostrarToast("Producto agotado", "error");
                return;
            }
            
            let item = cart.find(i => i.id === id);
            if (item) {
                item.qty++;
            } else {
                cart.push({ ...producto, qty: 1 });
            }
            
            updateCartUI();
            mostrarToast("¡Agregado al carrito!");
            
            // Efecto visual
            const badge = document.getElementById('cart-badge');
            if (badge) {
                badge.classList.add('scale-125');
                setTimeout(() => badge.classList.remove('scale-125'), 200);
            }
            
            const cartIcon = document.getElementById('cart-icon');
            if (cartIcon) {
                cartIcon.classList.replace('text-gray-400', 'text-beige');
            }
        }

        // Mantener todas las funciones del carrito original...
        // updateCartUI, cambiarCantidad, removeFromCart, calcularTotal, etc.
        // (Se mantienen igual que en el código anterior)

        // ============================================
        // OPTIMIZACIONES DE PERFORMANCE
        // ============================================

        function initLazyLoad() {
            if (!('IntersectionObserver' in window)) {
                // Fallback para navegadores antiguos
                document.querySelectorAll('img.lazy-load').forEach(img => {
                    img.src = img.dataset.src;
                    img.classList.remove('lazy-load');
                });
                return;
            }
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.dataset.src;
                        img.classList.remove('lazy-load');
                        observer.unobserve(img);
                    }
                });
            }, { rootMargin: '100px 0px' });
            
            document.querySelectorAll('img.lazy-load').forEach(img => observer.observe(img));
        }

        function initSwipeGestures() {
            let startX, startY;
            
            document.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });
            
            document.addEventListener('touchend', (e) => {
                if (!startX || !startY) return;
                
                const endX = e.changedTouches[0].clientX;
                const endY = e.changedTouches[0].clientY;
                const diffX = startX - endX;
                const diffY = Math.abs(startY - endY);
                
                if (diffY < 50 && Math.abs(diffX) > 50) {
                    if (diffX > 0) {
                        // Swipe izquierda - cerrar carrito si está abierto
                        const cartSidebar = document.getElementById('cart-sidebar');
                        if (cartSidebar && !cartSidebar.classList.contains('translate-x-full')) {
                            forceCloseCart();
                        }
                    } else {
                        // Swipe derecha - cerrar menú si está abierto
                        const leftSidebar = document.getElementById('left-sidebar');
                        if (leftSidebar && !leftSidebar.classList.contains('-translate-x-full')) {
                            handleBackAction();
                        }
                    }
                }
                
                startX = null;
                startY = null;
            }, { passive: true });
        }

        // ============================================
        // FUNCIONES DE UI (MANTENIDAS)
        // ============================================

        // Mantener todas las funciones de UI originales:
        // toggleCart, toggleMobileMenu, handleBackAction, forceCloseCart,
        // openProduct, closeProductModal, mostrarToast, etc.

        // Solo muestro una como ejemplo:
        function mostrarToast(mensaje, tipo = 'success') {
            const toast = document.getElementById('toast-modal');
            const content = document.getElementById('toast-content');
            
            if (!toast || !content) return;
            
            const icon = tipo === 'error' ? 'times' : tipo === 'info' ? 'info' : 'check';
            const color = tipo === 'error' ? 'bg-red-500' : tipo === 'info' ? 'bg-blue-500' : 'bg-green-500';
            
            content.innerHTML = `
                <div class="w-6 h-6 ${color} rounded-full flex items-center justify-center text-xs text-white">
                    <i class="fa fa-${icon}"></i>
                </div>
                <span class="font-bold text-sm">${mensaje}</span>`;
            
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('toast-visible'), 10);
            
            setTimeout(() => {
                toast.classList.remove('toast-visible');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 2000);
        }

        // ============================================
        // INICIALIZACIÓN DE EVENTOS
        // ============================================

        // Tecla Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const modal = document.getElementById('product-modal');
                const cartSidebar = document.getElementById('cart-sidebar');
                const leftSidebar = document.getElementById('left-sidebar');
                
                if (modal && !modal.classList.contains('hidden')) {
                    closeProductModal();
                } else if (cartSidebar && !cartSidebar.classList.contains('translate-x-full')) {
                    forceCloseCart();
                } else if (leftSidebar && !leftSidebar.classList.contains('-translate-x-full')) {
                    handleBackAction();
                }
            }
        });

        // Prevenir pérdida de datos
        window.addEventListener('beforeunload', () => {
            if (cart.length > 0) {
                localStorage.setItem('papajose_cart', JSON.stringify(cart));
            }
        });

        // Historial de navegación
        window.addEventListener('popstate', () => {
            const modal = document.getElementById('product-modal');
            const cartSidebar = document.getElementById('cart-sidebar');
            const leftSidebar = document.getElementById('left-sidebar');
            
            if (modal && !modal.classList.contains('hidden')) {
                closeProductModal();
            }
            if (cartSidebar && !cartSidebar.classList.contains('translate-x-full')) {
                forceCloseCart();
            }
            if (leftSidebar && !leftSidebar.classList.contains('-translate-x-full')) {
                handleBackAction();
            }
        });

        // Debug helper
        window.recargarTodo = function() {
            localStorage.clear();
            location.reload();
        };

    </script>
